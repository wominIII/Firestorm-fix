name: pre-commit

on:
  pull_request:
  push:
    branches: [main, contribute]
    tags: [v*]


jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Check files changed by this update
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="origin/$BASE_REF"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE="$BEFORE_SHA"
          else
            BASE="HEAD^"
          fi

          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD)
          if (( ${#files[@]} == 0 )); then
            echo "No added or modified files to check."
            exit 0
          fi

          printf 'Checking %s changed files\n' "${#files[@]}"
          pre-commit run --show-diff-on-failure --files "${files[@]}"
